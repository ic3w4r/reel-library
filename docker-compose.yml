# Fixed project name so the data volume is always "instamcp_instamcp-data", whatever the folder is called.
name: instamcp

services:
  instamcp:
    # Published release image (Intel/AMD + Apple Silicon). `docker compose up -d` pulls it if missing;
    # `docker compose pull` updates it; `docker compose up -d --build` builds from this source instead.
    image: ${INSTAMCP_IMAGE:-ghcr.io/ic3w4r/reel-library:latest}
    build: .
    container_name: instamcp
    # Bound to localhost only: the app has no login of its own and holds your API key.
    ports:
      - "127.0.0.1:${INSTAMCP_PORT:-8090}:8080"   # change with INSTAMCP_PORT=xxxx
    volumes:
      - instamcp-data:/data   # database, thumbnails, settings, speech model
    environment:
      # Optional: API keys can also be entered in the app (Settings → AI engines).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    restart: unless-stopped

volumes:
  instamcp-data:
